<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>ak-pointer</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body, #app { height: 100%; margin: 0; }
      body {
        background: #1b1b1b;
        color: #e8e8e8;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button, input, textarea { font: inherit; color: inherit; }
      button {
        background: #2c2c2c;
        border: 1px solid #4a4a4a;
        border-radius: 6px;
        padding: 5px 10px;
      }
      button:disabled { opacity: 0.4; }
      button.primary { background: #345234; border-color: #4e7a4e; }
      input, textarea {
        background: #111;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 6px 8px;
      }
      #app { display: flex; flex-direction: column; }
      header { padding: 10px 14px 8px; border-bottom: 1px solid #333; }
      h1 { font-size: 16px; margin: 0; }
      h2 { font-size: 15px; margin: 12px 0 6px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .muted { color: #9a9a9a; }
      .warning { color: #d29632; margin: 8px 0 0; }
      .status { margin: 8px 0 2px; }
      .layout { flex: 1; min-height: 0; display: flex; }
      aside, main { overflow: auto; }
      aside { width: 320px; flex: none; border-right: 1px solid #333; padding: 12px; }
      main { flex: 1; padding: 8px 16px 16px; }
      .owner { margin: 12px 0 4px; font-weight: 650; }
      label.choice { display: flex; gap: 8px; align-items: flex-start; margin: 3px 0; }
      .bg { margin: 0 0 4px 22px; }
      .card { padding: 8px 0; border-bottom: 1px solid #2e2e2e; }
      .event { display: flex; gap: 8px; align-items: center; margin: 2px 0; }
      .event code { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      textarea { width: 100%; }
      #raw { min-height: 280px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="renderer.js"></script>
  </body>
</html>
